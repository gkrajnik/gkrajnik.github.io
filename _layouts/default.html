<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% unless page.home %}{{ page.title | escape }} | {% endunless %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0c111b">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">GK</span><span>{{ site.title | escape }}</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/research.html' | relative_url }}"{% if page.nav == 'research' %} aria-current="page"{% endif %}>Research</a>
          <a href="{{ '/projects.html' | relative_url }}"{% if page.nav == 'projects' %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ site.github_url | escape }}">GitHub</a>
        </nav>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <div><strong>{{ site.author | escape }}</strong><span>AI &amp; mechanistic interpretability</span></div>
        <div class="footer-links"><a href="mailto:{{ site.email | escape }}">Email</a><a href="{{ site.github_url | escape }}">GitHub</a></div>
        <p>© {{ 'now' | date: '%Y' }} {{ site.author | escape }}</p>
      </footer>
    </div>
  </body>
</html>
